[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo"
version = "0.0.1"
description = "Nexo: asistente personal local con herramientas controladas por políticas"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115",
	"google-genai>=1.0",
	"keyring>=25",
	"pydantic>=2.6",
	"typer>=0.12",
	"uvicorn[standard]>=0.30",
]

[project.scripts]
nexo = "nexo.interfaces.cli:app"

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nexo.interfaces" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
